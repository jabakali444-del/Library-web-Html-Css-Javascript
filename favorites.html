<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>

    <title>Favorite Books</title>
</head>

<body data-page="favorites">
    <div class="header">
        <h2 class="title">Favorite Books</h2>

        <div class="dropdown nav-dropdown">
            <button class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
                Menu
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="index.html">Home</a></li>
                <li><a class="dropdown-item" href="favorites.html">Favorites</a></li>
                <li><a class="dropdown-item" href="status.html">Statistics</a></li>
                <li><a class="dropdown-item" href="signup.html">Sign Up</a></li>
                <li><a class="dropdown-item" href="login.html">Login</a></li>
                <li>
                    <hr class="dropdown-divider" />
                </li>
                <li>
                    <a class="dropdown-item" href="#" onclick="logout()">Logout</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="container main-container">
        <div class="top-bar">
            <input type="text" id="searchInput" placeholder="Search in favorites..." />

            <select id="genreFilter">
                <option value="">All genres</option>
            </select>

            <select id="yearFilter">
                <option value="">All years</option>
            </select>

            <select id="availabilityFilter">
                <option value="">All books</option>
                <option value="available">Available</option>
                <option value="unavailable">Not available</option>
            </select>

            <select id="sortSelect">
                <option value="title-asc">Title A → Z</option>
                <option value="title-desc">Title Z → A</option>
                <option value="year-desc">Newest year</option>
                <option value="year-asc">Oldest year</option>
                <option value="author-asc">Author A → Z</option>
                <option value="author-desc">Author Z → A</option>
            </select>

            <button class="mode" id="modeToggle" type="button">Dark Mode</button>
        </div>

        <h2>Your Favorite Books</h2>
        <div id="booksContainer" class="books-container"></div>
    </div>

    <div id="toast" class="toast"></div>
</body>

</html>
